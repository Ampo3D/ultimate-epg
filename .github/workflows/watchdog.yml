# GitHub often skips scheduled runs. This tiny job looks twice an hour and starts a
# rebuild if the last good build is over 3 hours old, so the guide never runs out.
name: Watchdog

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rebuild if the guide is getting old
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          active=$(gh run list -R "$REPO" -w build.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" != "0" ]; then echo "A build is already running or waiting"; exit 0; fi
          last=$(gh run list -R "$REPO" -w build.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          age=999999
          if [ -n "$last" ]; then age=$(( $(date +%s) - $(date -d "$last" +%s) )); fi
          echo "Last good build started $age seconds ago"
          if [ "$age" -gt 10800 ]; then gh workflow run build.yml -R "$REPO" --ref main; echo "Rebuild started"; fi
