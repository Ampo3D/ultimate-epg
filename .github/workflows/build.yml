# Replacement for .github/workflows/build.yml
#
# Changes against the current file (everything else is identical):
# 1. Step timeout 80 -> 150 min, job timeout 90 -> 170 min. Measured "Download sources,
#    find new guides, build" step: 29-60 min over the 10 completed runs of 2026-11-05
#    (60 min in run 41971060255 = 75% of the old limit). The source list grows by itself
#    (auto-discovery), so the old limit is one slow guide host away from killing a build.
# 2. Cron line unchanged; its comment now says the truth: GitHub fired it once in 8.5 h
#    on 2026-11-05, and the watchdog relay (fix_1) is what starts builds when the PC is off.
# 4. Old 1.3 GB guide-copy caches are deleted (8 copies = 10.26 GB, the repo limit), which
#    needs actions: write.
# 3. "Save newly found guides": if all three push attempts fail, say so in alert.md
#    instead of silently losing the discovered guides.
name: Build EPG

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/watchdog.yml
  schedule:
    - cron: "17 */3 * * *"   # asked for every 3 hours; GitHub skips many - watchdog.yml starts the missing ones
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test email
        type: boolean
        default: false

permissions:
  contents: write     # to save newly found guides back to the repo
  issues: write       # the email: a mention on a GitHub issue
  pages: write
  id-token: write
  actions: write      # only to delete old guide-copy caches (each 1.3 GB, repo limit 10 GB)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Make room on the server   # some GitHub servers have 72 GB, others 145; the saved guides alone take 16
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          ref: main   # always the newest copy, including guides found by the run before
      - uses: actions/cache@v6   # last good copy of each guide, in case a download fails
        with:
          path: data/cache
          key: epg-cache-${{ github.run_id }}
          restore-keys: epg-cache-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download sources, find new guides, build
        timeout-minutes: 150   # measured 29-60 min; fails like a normal step, so the alert and save steps after it still run
        run: python ultimate_epg.py --build-site site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Disk space left   # the saved guide copies are big; this shows if the server is close to full
        if: always()
        continue-on-error: true
        run: |
          df -h . && du -sh data/cache || true
          free=$(df --output=avail -k . | tail -1)
          if [ "$free" -lt 8388608 ]; then echo "- The build server had only $((free / 1048576)) GB of disk left: guide updates may soon fail" >> alert.md; fi
      - name: Save newly found guides
        if: always()              # also after a refused build, so its notes are kept
        continue-on-error: true   # never let this block publishing your links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/auto_sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-found guides update"
            git reset -q --hard HEAD   # the build's own config.json edits are never published; they'd block the pull
            saved=no
            for i in 1 2 3; do   # your own push can land in between: try again
              if git pull --rebase -X theirs origin main && git push; then saved=yes; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            if [ "$saved" != yes ]; then echo "- The guides this run found could not be saved to the repo (push refused 3 times)" >> alert.md; fi
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy1   # GitHub sometimes takes over 10 min to publish the site, and 10 min is this action's maximum wait
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - id: deploy2   # so a timed-out try is tried once more, waiting up to 25 min
        if: steps.deploy1.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            // GitHub cancels the timed-out try. A new try needs its own version name: with the same one
            // GitHub hands back the cancelled try, so a second deploy-pages step never worked.
            const {owner, repo} = context.repo;
            const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                                               {owner, repo, run_id: context.runId, per_page: 100});
            const art = arts.find(a => a.name === 'github-pages');
            if (!art) throw new Error('The site upload (github-pages) was not found');
            const version = `${context.sha}-retry-${process.env.GITHUB_RUN_ATTEMPT || 1}`;
            const {data: dep} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: art.id, pages_build_version: version, oidc_token: await core.getIDToken()});
            const id = dep.id || (dep.status_url || '').split('/').pop() || version;  // as deploy-pages does
            core.info(`Second try started: ${id}`);
            const failed = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            const end = Date.now() + 25 * 60 * 1000;
            while (Date.now() < end) {
              await new Promise(r => setTimeout(r, 15000));
              const {data: st} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', {owner, repo, id});
              core.info(`Status: ${st.status}`);
              if (st.status === 'succeed') { core.setOutput('page_url', dep.page_url); return; }
              if (failed.includes(st.status)) throw new Error(`Publishing failed: ${st.status}`);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', {owner, repo, id}).catch(() => {});
            throw new Error('Publishing took over 25 minutes');
      - id: deploy
        name: Published?
        env:
          URL: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
        run: echo "page_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Drop old guide copies from the cache   # 8 copies x 1.29 GB = 10.26 GB on 2026-11-05: at GitHub's 10 GB limit
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |   # this run's own copy is saved after this step; keep the 2 newest older ones as spares
          gh cache list --key epg-cache- --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' | xargs -r -n1 gh cache delete || true
      - name: Email you if something went wrong
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ job.status }}
          TEST: ${{ inputs.test_alert }}
          PAGE: https://ampo3d.github.io/ultimate-epg/health.html
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" != "success" ]; then echo "- The guide update failed, so your links still show the last good guide: $RUN" >> alert.md; fi
          if [ "$TEST" = "true" ]; then echo "- This is a test. Nothing is wrong." >> alert.md; fi
          [ -f alert.md ] || exit 0
          for i in 1 2 3; do   # a GitHub hiccup must not swallow the email
            n=$(gh issue list --state open --search "Guide needs attention in:title author:app/github-actions" --json number --jq '.[0].number // ""') && break
            n=""; sleep 15
          done
          if [ -n "$n" ]; then   # failed builds and a full disk repeat every run: tell you once every 12 hours, not every time
            told=$(gh issue view "$n" --json body,createdAt,comments --jq '[(select(now - (.createdAt | fromdateiso8601) < 43200) | .body), (.comments[] | select(now - (.createdAt | fromdateiso8601) < 43200) | .body)] | join(" ")' || true)
            for k in "The guide update failed" "GB of disk left"; do
              if printf '%s' "$told" | grep -qF "$k"; then grep -vF "$k" alert.md > alert.tmp || true; mv alert.tmp alert.md; fi
            done
            [ -s alert.md ] || exit 0
          fi
          body="@Ampo3D your guide needs a look: $(cat alert.md) Full report: $PAGE"
          if [ -n "$n" ] && gh issue comment "$n" --body "$body"; then exit 0; fi
          gh issue create --title "Guide needs attention" --body "$body"   # no open issue, or it can't take comments
