# Rebuilds your playlist + guide on GitHub's servers every 6 hours, searches the
# internet for new guides, and publishes everything on GitHub Pages - so your
# links work even when your PC is off.
name: Build EPG

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/watchdog.yml
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (GitHub sometimes skips a run - the guide always covers 2 days)
  workflow_dispatch:

permissions:
  contents: write     # to save newly found guides back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always the newest copy, including guides found by the run before
      - uses: actions/cache@v6   # last good copy of each guide, in case a download fails
        with:
          path: data/cache
          key: epg-cache-${{ github.run_id }}
          restore-keys: epg-cache-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download sources, find new guides, build
        run: python ultimate_epg.py --build-site site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save newly found guides
        if: always()              # also after a refused build, so its notes are kept
        continue-on-error: true   # never let this block publishing your links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/auto_sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-found guides update"
            git pull --rebase -X theirs --autostash origin main && git push
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
