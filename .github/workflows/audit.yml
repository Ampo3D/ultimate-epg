# One-off listing check, removed again once it has run.
name: Audit Canada

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/cache/restore@v5
        with:
          path: data/cache
          key: epg-cache-none
          restore-keys: epg-cache-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python audit_canada.py
      - uses: actions/upload-artifact@v5
        with:
          name: audit
          path: audit.json
